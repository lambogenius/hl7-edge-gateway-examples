# Sample 02: partners → HTTPS (REST and SOAP) → HL7 Edge Gateway → MLLP → MEDITECH
#   docker compose up -d          creates a test certificate, starts the gateway and a stand-in MEDITECH
name: hl7edge-sample-02

services:
  # One-off: a test CA and a server certificate for the gateway, in ./certs (kept if already there).
  certs:
    image: alpine:3.20
    volumes: ["./certs:/certs"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        [ -f /certs/gateway.crt ] && exit 0
        apk add --no-cache -q openssl && cd /certs &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=Sample 02 test CA" -keyout ca.key -out ca.crt 2>/dev/null &&
        openssl req -newkey rsa:2048 -nodes -subj /CN=localhost -keyout gateway.key -out gateway.csr 2>/dev/null &&
        printf 'subjectAltName=DNS:localhost,DNS:gateway,IP:127.0.0.1\n' > san.ext &&
        openssl x509 -req -in gateway.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 365 -extfile san.ext -out gateway.crt 2>/dev/null &&
        chmod 644 gateway.key && rm gateway.csr san.ext ca.srl && echo "test certificates created in ./certs"

  gateway:
    image: lambogenius/hl7-edge-gateway:${GATEWAY_VERSION:-0.3.0}
    env_file: .env
    ports:
      - "8443:8443"   # HTTPS: REST /hl7/results and SOAP /Hl7Service
      - "8080:8080"   # admin console
    volumes:
      - ./gateway.toml:/etc/hl7-edge-gateway/hl7-edge-gateway.toml:ro
      - ./certs:/etc/hl7-edge-gateway/certs:ro
      - queue:/var/lib/hl7-edge-gateway
    depends_on:
      certs: { condition: service_completed_successfully }
      meditech: { condition: service_started }

  # Stand-in for MEDITECH's inbound MLLP interfaces (results on 6661, ADT on 6662).
  meditech:
    image: python:3.12-slim
    command: ["python", "-u", "/app/receiver.py"]
    volumes: ["./meditech:/app:ro"]

volumes:
  queue:
