# The one address MEDITECH connects to (in production: a VIP, F5, NetScaler, keepalived...).
# "balance first" is active/passive: every new connection goes to gw1 while it is ready, else to gw2.
# Readiness is the gateway's /ready on its admin port; a node that is down or not ready is skipped
# within about 2 seconds, and its open connections are closed so MEDITECH reconnects to the other.

global
    log stdout format raw local0

# Re-resolve gw1/gw2 through Docker's DNS: a restarted container can come back with another IP
# address, and an address resolved once at startup would then point at the wrong node (or none).
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 2s
    timeout queue 10s
    timeout client 1h      # MLLP connections are long-lived
    timeout server 1h
    # A connection that fails to reach a node (it just died, before the health check noticed) is
    # retried on the other node instead of waiting for the dead one.
    retries 3
    option redispatch 1

frontend lab_results
    bind :7890
    default_backend lab_results

backend lab_results
    balance first
    option httpchk
    http-check send meth GET uri /ready
    # Health check every second (faster while a node changes state); a failed connection marks the
    # node down at once.
    default-server check port 8080 inter 1s fastinter 500ms downinter 1s fall 2 rise 2 observe layer4 error-limit 1 on-error mark-down on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server gw1 gw1:7890
    server gw2 gw2:7890
