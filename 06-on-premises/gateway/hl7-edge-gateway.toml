# HL7 Edge Gateway on edge1 and edge2: the same file on both; only HL7EDGE_NODE_ID differs
# (set in /etc/hl7-edge-gateway/env, with the secrets).

node_id = "${HL7EDGE_NODE_ID}"

[admin]
listen = "0.0.0.0:8080"
token = "${HL7EDGE_ADMIN_TOKEN}"

[store]
backend = "jetstream"
urls = ["tls://10.0.10.11:4222", "tls://10.0.10.12:4222", "tls://10.0.10.13:4222"]
ca = "/etc/hl7-edge-gateway/nats-ca.crt"
user = "hl7edge"
password = "${HL7EDGE_NATS_PASSWORD}"
replicas = 3
ack_wait = "30s"

# MEDITECH sends lab results to the VIP, 10.0.10.10:7890.
[[route]]
name = "lab-results"
mode = "store_and_forward"
request_timeout = "15s"
source = { type = "mllp", listen = "0.0.0.0:7890" }

[route.destination]
type = "http"
url = "${LAB_API_URL}"
headers = { Authorization = "Bearer ${LAB_API_TOKEN}" }

[route.store_and_forward]
on_reject = "dead_letter"
retry = { initial = "2s", max = "60s", multiplier = 2.0 }
