# keepalived on edge1: /etc/keepalived/keepalived.conf
# The VIP 10.0.10.10 is where MEDITECH connects. It lives on edge1 while edge1's gateway is ready
# (priority 150), and moves to edge2 (priority 100) within a few seconds if it is not.

global_defs {
    router_id edge1
    enable_script_security
    script_user root
}

vrrp_script gateway_ready {
    script "/etc/keepalived/check_gateway.sh"
    interval 2          # seconds between checks
    timeout 3
    fall 2              # 2 failures: not ready
    rise 2              # 2 successes: ready again
}

vrrp_instance HL7EDGE {
    state BACKUP        # both start as backup; priority decides
    interface eth0      # the interface on the 10.0.10.0/24 network
    virtual_router_id 51
    priority 150
    advert_int 1
    # Unicast VRRP: works on networks that block multicast.
    unicast_src_ip 10.0.10.11
    unicast_peer {
        10.0.10.12
    }
    authentication {
        auth_type PASS
        auth_pass hl7edge1     # up to 8 characters; the same on both hosts
    }
    virtual_ipaddress {
        10.0.10.10/24
    }
    track_script {
        gateway_ready
    }
}
