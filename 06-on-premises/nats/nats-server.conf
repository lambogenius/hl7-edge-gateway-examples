# NATS JetStream for HL7 Edge Gateway: the same file on edge1, edge2 and edge3.
# Per-host values come from /etc/nats/env (see nats-server.service): NATS_SERVER_NAME and
# HL7EDGE_NATS_PASSWORD. Each host has its own certificate in /etc/nats/certs (certs/make-certs.sh).

server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 127.0.0.1:8222                     # monitoring, local only: curl localhost:8222/jsz

# Clients (the gateways) must use TLS and a password.
tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file:  "/etc/nats/certs/server.key"
  ca_file:   "/etc/nats/certs/ca.crt"
  timeout: 2
}
authorization {
  users = [
    { user: hl7edge, password: $HL7EDGE_NATS_PASSWORD }
  ]
}

jetstream {
  store_dir: "/var/lib/nats"
  max_file_store: 20GB                   # disk for queues and dead letters
  max_memory_store: 256MB
}

# The cluster between the three hosts: mutual TLS, so only hosts with a certificate from your CA
# can join.
cluster {
  name: hl7edge
  listen: 0.0.0.0:6222
  tls {
    cert_file: "/etc/nats/certs/server.crt"
    key_file:  "/etc/nats/certs/server.key"
    ca_file:   "/etc/nats/certs/ca.crt"
    verify: true
    timeout: 2
  }
  routes: [
    "nats-route://10.0.10.11:6222"
    "nats-route://10.0.10.12:6222"
    "nats-route://10.0.10.13:6222"
  ]
}
