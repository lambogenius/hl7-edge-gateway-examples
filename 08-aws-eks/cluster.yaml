# eksctl cluster for sample 08: three nodes in three availability zones, with the add-ons the sample
# needs (EBS CSI driver for NATS disks; IAM for the AWS Load Balancer Controller).
#   eksctl create cluster -f cluster.yaml          (setup.sh does this; set region and zones first)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: hl7edge
  region: ca-central-1
  version: "1.35"
availabilityZones: [ca-central-1a, ca-central-1b, ca-central-1d]
iam:
  withOIDC: true
  serviceAccounts:
    - metadata: { name: aws-load-balancer-controller, namespace: kube-system }
      wellKnownPolicies: { awsLoadBalancerController: true }
addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies: { ebsCSIController: true }
managedNodeGroups:
  - name: ng-1
    instanceType: m6i.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 6
    privateNetworking: true        # nodes in private subnets
    volumeSize: 30
